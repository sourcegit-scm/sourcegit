name: DevBoard Identity Verification

on:
  push:
    branches:
      - refactor/devboard-identity

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run identity contract tests
        run: node --test tests/devboard-identity.test.mjs

      - name: Scan repository identity
        run: node scripts/check-devboard-identity.mjs

      - name: Build DevBoard
        run: dotnet build DevBoard.slnx -c Debug

      - name: Run DevBoard tests
        run: dotnet test tests/DevBoard.Tests/DevBoard.Tests.csproj -c Release
