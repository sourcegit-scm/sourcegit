name: LocalLLM Branch Check

on:
  push:
    branches: [feature/local-llm-provider]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Expose LocalLLM runtime controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Views/Preferences.axaml")
          text = path.read_text(encoding="utf-8-sig")
          anchor = '                      <TextBlock Margin="0,12,0,0" Text="Temperature"/>'
          controls = '''                      <TextBlock Margin="0,12,0,0" Text="Backend"/>
                      <ComboBox Margin="0,4,0,0" Height="28" SelectedIndex="{Binding LocalBackendIndex, Mode=TwoWay}">
                        <ComboBoxItem Content="Auto"/>
                        <ComboBoxItem Content="CPU / Metal"/>
                        <ComboBoxItem Content="CUDA"/>
                        <ComboBoxItem Content="Vulkan"/>
                      </ComboBox>

                      <TextBlock Margin="0,12,0,0" Text="GPU Layers (-1 = all)"/>
                      <NumericUpDown Margin="0,4,0,0" Height="28" Minimum="-1" Maximum="999" Increment="1" Value="{Binding GpuLayerCount, Mode=TwoWay}"/>

                      <TextBlock Margin="0,12,0,0" Text="Threads"/>
                      <NumericUpDown Margin="0,4,0,0" Height="28" Minimum="1" Maximum="256" Increment="1" Value="{Binding LocalThreads, Mode=TwoWay}"/>

                      <TextBlock Margin="0,12,0,0" Text="Batch Size"/>
                      <NumericUpDown Margin="0,4,0,0" Height="28" Minimum="1" Maximum="4096" Increment="64" Value="{Binding LocalBatchSize, Mode=TwoWay}"/>

'''

          if 'Text="Backend"' not in text:
              if anchor not in text:
                  raise SystemExit("LocalLLM temperature anchor not found")
              path.write_text(text.replace(anchor, controls + anchor, 1), encoding="utf-8")
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/SourceGit.Tests/SourceGit.Tests.csproj --configuration Release --disable-build-servers

      - name: Publish Linux x64 NativeAOT
        run: dotnet publish src/SourceGit.csproj --configuration Release --runtime linux-x64 --output publish

      - name: Commit runtime controls
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- src/Views/Preferences.axaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Views/Preferences.axaml
          git commit -m "feat: expose LocalLLM runtime controls"
          git push origin HEAD:feature/local-llm-provider
