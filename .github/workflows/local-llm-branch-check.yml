name: LocalLLM Branch Check

on:
  push:
    branches: [feature/local-llm-provider]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/local-llm-provider

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Add LocalLLM settings UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/Views/Preferences.axaml")
          text = path.read_text(encoding="utf-8")
          start = text.index('                <DataTemplate DataType="ai:Service">\n                  <StackPanel Orientation="Vertical" MaxWidth="680">')
          end_marker = '                </DataTemplate>\n              </ContentControl.DataTemplates>'
          end = text.index(end_marker, start) + len('                </DataTemplate>')
          replacement = '''                <DataTemplate DataType="ai:Service">
                  <StackPanel Orientation="Vertical" MaxWidth="680">
                    <TextBlock Text="{DynamicResource Text.Preferences.AI.Name}"/>
                    <TextBox Margin="0,4,0,0" CornerRadius="3" Height="28" Text="{Binding Name, Mode=TwoWay}"/>

                    <TextBlock Margin="0,12,0,0" Text="Provider"/>
                    <ComboBox Margin="0,4,0,0" Height="28" SelectedIndex="{Binding ProviderIndex, Mode=TwoWay}">
                      <ComboBoxItem Content="OpenAI"/>
                      <ComboBoxItem Content="LocalLLM"/>
                    </ComboBox>

                    <StackPanel IsVisible="{Binding IsOpenAI}">
                      <TextBlock Margin="0,12,0,0" Text="{DynamicResource Text.Preferences.AI.Server}"/>
                      <TextBox Margin="0,4,0,0" CornerRadius="3" Height="28" Text="{Binding Server, Mode=TwoWay}"/>

                      <TextBlock Margin="0,12,0,0" Text="{DynamicResource Text.Preferences.AI.ApiKey}"/>
                      <TextBox Margin="0,4,0,0" CornerRadius="3" Height="28" Text="{Binding ApiKey, Mode=TwoWay}" PasswordChar="*" RevealPassword="{Binding ReadApiKeyFromEnv, Mode=OneWay}"/>
                      <CheckBox Margin="0,4,0,0" Height="28" Content="{DynamicResource Text.Preferences.AI.ReadApiKeyFromEnv}" IsChecked="{Binding ReadApiKeyFromEnv, Mode=TwoWay}"/>

                      <TextBlock Margin="0,8,0,0" Text="{DynamicResource Text.Preferences.AI.Model}"/>
                      <TextBox Margin="0,4,0,0" CornerRadius="3" Height="28" Text="{Binding Model, Mode=TwoWay}" IsEnabled="{Binding !AutoFetchAvailableModels, Mode=OneWay}"/>
                      <CheckBox Margin="0,4,0,0" Height="28" Content="{DynamicResource Text.Preferences.AI.Model.AutoFetchAvailableModels}" IsChecked="{Binding AutoFetchAvailableModels, Mode=TwoWay}"/>

                      <TextBlock Margin="0,8,0,0" Text="{DynamicResource Text.Preferences.AI.ReasoningEffortLevel}"/>
                      <ComboBox Margin="0,4,0,0" Height="28" HorizontalAlignment="Stretch" ItemsSource="{Binding Source={x:Static ai:Options.ReasoningEffortLevels}}" SelectedItem="{Binding ReasoningEffortLevel, Mode=TwoWay}"/>
                    </StackPanel>

                    <StackPanel IsVisible="{Binding IsLocalLlm}">
                      <TextBlock Margin="0,12,0,0" Text="Default Model (.gguf)"/>
                      <TextBox Margin="0,4,0,0" CornerRadius="3" Height="28" Text="{Binding LocalModelPath, Mode=TwoWay}" Watermark="/path/to/model.gguf"/>
                      <TextBlock Margin="0,4,0,0" FontSize="11" Foreground="{DynamicResource Brush.FG2}" Text="{Binding LocalModelStatus}"/>

                      <TextBlock Margin="0,12,0,0" Text="Temperature"/>
                      <NumericUpDown Margin="0,4,0,0" Height="28" Minimum="0" Maximum="2" Increment="0.1" Value="{Binding Temperature, Mode=TwoWay}"/>

                      <TextBlock Margin="0,12,0,0" Text="Context Window"/>
                      <NumericUpDown Margin="0,4,0,0" Height="28" Minimum="512" Maximum="131072" Increment="512" Value="{Binding ContextWindow, Mode=TwoWay}"/>

                      <CheckBox Margin="0,8,0,0" Height="28" Content="Auto-load model" IsChecked="{Binding AutoLoadModel, Mode=TwoWay}"/>
                    </StackPanel>

                    <TextBlock Margin="0,12,0,0" Text="{DynamicResource Text.Preferences.AI.AdditionalPrompt}"/>
                    <TextBox Height="120" Margin="0,4,0,0" CornerRadius="3" VerticalContentAlignment="Top" Text="{Binding AdditionalPrompt, Mode=TwoWay}" AcceptsReturn="true" TextWrapping="Wrap"/>
                  </StackPanel>
                </DataTemplate>'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

      - name: Test
        run: dotnet test tests/SourceGit.Tests/SourceGit.Tests.csproj --configuration Release --disable-build-servers

      - name: Commit generated UI patch
        run: |
          if git diff --quiet -- src/Views/Preferences.axaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Views/Preferences.axaml
          git commit -m "feat: expose LocalLLM AI settings"
          git push
