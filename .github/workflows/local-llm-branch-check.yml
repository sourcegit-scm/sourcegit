# Temporary feature verification workflow.
name: LocalLLM Branch Check

on:
  push:
    branches:
      - feature/local-llm-provider
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply UI edit
        id: apply
        run: |
          python .github/scripts/apply-local-llm-ui.py
          if git diff --quiet -- src/Views/Preferences.axaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit UI edit
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Views/Preferences.axaml
          git commit -m "ui: remove bundled LocalLLM CUDA option"
          git push origin HEAD:feature/local-llm-provider

  verify:
    needs: apply-ui
    if: needs.apply-ui.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/SourceGit.Tests/SourceGit.Tests.csproj --configuration Release --disable-build-servers

      - name: Format
        run: dotnet format --verify-no-changes src/SourceGit.csproj

  build:
    needs: apply-ui
    if: needs.apply-ui.outputs.changed != 'true'
    uses: ./.github/workflows/build.yml
