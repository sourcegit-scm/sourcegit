name: Apply DevBoard Package Identity

on:
  push:
    branches:
      - refactor/devboard-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/devboard-identity
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rename packaging identity
        shell: bash
        run: |
          set -euo pipefail
          git mv build/resources/_common/applications/sourcegit.desktop build/resources/_common/applications/devboard.desktop
          git mv build/resources/_common/icons/sourcegit.png build/resources/_common/icons/devboard.png
          git mv build/resources/appimage/sourcegit.appdata.xml build/resources/appimage/devboard.appdata.xml
          git mv build/resources/flatpak/sourcegit.desktop build/resources/flatpak/devboard.desktop
          [ ! -e build/resources/_common/sourcegit ] || git mv build/resources/_common/sourcegit build/resources/_common/devboard
          [ ! -e build/resources/appimage/sourcegit ] || git mv build/resources/appimage/sourcegit build/resources/appimage/devboard

          python3 - <<'PY'
          from pathlib import Path
          text_ext = {'.md','.sh','.ps1','.desktop','.xml','.plist','.spec','.json','.yml','.yaml'}
          for root in [Path('build'), Path('DevBoard.slnx')]:
              paths = [root] if root.is_file() else root.rglob('*')
              for p in paths:
                  if not p.is_file(): continue
                  if p.suffix not in text_ext and p.name not in {'control','postinst','preinst','prerm','devboard','sourcegit'}: continue
                  try: data = p.read_text(encoding='utf-8-sig')
                  except UnicodeDecodeError: continue
                  data = data.replace('SourceGit', 'DevBoard').replace('sourcegit', 'devboard')
                  p.write_text(data, encoding='utf-8')
          PY
      - name: Verify package identity
        run: node --test tests/devboard-identity.test.mjs
      - name: Run DevBoard tests
        run: dotnet test tests/DevBoard.Tests/DevBoard.Tests.csproj -c Release
      - name: Commit packaging rename
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A build DevBoard.slnx
          git commit -m 'build: rename platform packages to DevBoard'
          git push origin HEAD:refactor/devboard-identity
