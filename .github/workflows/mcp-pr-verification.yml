name: MCP PR Verification

on:
  push:
    branches: [feat/devspace-mcp-sse]
  workflow_dispatch:

concurrency:
  group: mcp-pr-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run SourceGit tests
        run: dotnet test tests/SourceGit.Tests/SourceGit.Tests.csproj --configuration Release

  verify-windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build SourceGit Release
        run: dotnet build src/SourceGit.csproj --configuration Release -p:DisableAOT=true
      - name: Publish SourceGit NativeAOT win-x64
        run: dotnet publish src/SourceGit.csproj --configuration Release --runtime win-x64
