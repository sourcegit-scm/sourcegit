name: Build
on:
  workflow_call:
jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2022
            runtime: win-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            runtime: osx-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            runtime: osx-arm64
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            container: ubuntu:20.04
          - name: Linux (arm64)
            os: ubuntu-latest
            runtime: linux-arm64
            container: ubuntu:20.04
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y sudo
          sudo apt-get install -y curl wget git unzip zip libicu66 tzdata clang
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Configure arm64 packages
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-updates main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-backports main restricted' \
          | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo sed -i -e 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo sed -i -e 's/^deb mirror/deb [arch=amd64] mirror/g' /etc/apt/sources.list
      - name: Install cross-compiling dependencies
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm gcc-aarch64-linux-gnu
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish src/DevBoard.csproj -c Release -o publish -r ${{ matrix.runtime }}
      - name: Verify Windows terminal native payload
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        run: |
          $expected = "publish/native-terminal/${{ matrix.runtime }}/Microsoft.Terminal.Control.dll"
          if (-not (Test-Path $expected -PathType Leaf)) {
            throw "Missing native Windows Terminal payload: $expected"
          }

          $wrongRid = if ('${{ matrix.runtime }}' -eq 'win-x64') { 'win-arm64' } else { 'win-x64' }
          if (Test-Path "publish/native-terminal/$wrongRid") {
            throw "Unexpected native Windows Terminal payload for $wrongRid"
          }

          $dlls = @(Get-ChildItem publish/native-terminal -Recurse -Filter Microsoft.Terminal.Control.dll)
          if ($dlls.Count -ne 1) {
            throw "Expected exactly one Microsoft.Terminal.Control.dll, found $($dlls.Count)"
          }
      - name: Verify non-Windows publish excludes Windows terminal
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        run: test ! -d publish/native-terminal
      - name: Rename executable file
        if: startsWith(matrix.runtime, 'linux-')
        run: mv publish/DevBoard publish/devboard
      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-') || startsWith(matrix.runtime, 'osx-')
        run: |
          tar -cvf "devboard.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "devboard.${{ matrix.runtime }}.tar" publish
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: devboard.${{ matrix.runtime }}
          path: publish/*
