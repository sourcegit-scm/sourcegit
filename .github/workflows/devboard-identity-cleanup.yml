name: DevBoard Identity Cleanup
on:
  push:
    branches: [refactor/devboard-identity]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/devboard-identity
          submodules: true
          fetch-depth: 0
      - name: Apply final DevBoard identity cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            '.github/workflows/format-check.yml': [('src/SourceGit.csproj','src/DevBoard.csproj')],
            'DevBoard.slnx': [
              ('build/resources/_common/applications/sourcegit.desktop','build/resources/_common/applications/devboard.desktop'),
              ('build/resources/_common/icons/sourcegit.png','build/resources/_common/icons/devboard.png'),
              ('build/resources/_common/sourcegit','build/resources/_common/devboard'),
              ('build/resources/appimage/sourcegit.appdata.xml','build/resources/appimage/devboard.appdata.xml'),
              ('build/resources/appimage/sourcegit','build/resources/appimage/devboard'),
            ],
            'src/AI/Hosting/AIRouterHost.cs': [('owned_by\\\":\\\"sourcegit','owned_by\\\":\\\"devboard')],
            'src/AI/Hosting/AIRouterHostOptions.cs': [('sourcegit-local','devboard-local')],
            'src/App.axaml.cs': [('sourcegit.interactive_rebase','devboard.interactive_rebase')],
            'src/Commands/DiffTool.cs': [('difftool.sourcegit','difftool.devboard'), ('--tool=sourcegit','--tool=devboard')],
            'src/Commands/MergeTool.cs': [('mergetool.sourcegit','mergetool.devboard'), ('--tool=sourcegit','--tool=devboard')],
            'src/Models/RepositorySettings.cs': [('sourcegit.settings','devboard.settings')],
            'src/Models/RepositoryUIStates.cs': [('sourcegit.uistates','devboard.uistates')],
            'src/Models/WorktreeBaseBranch.cs': [('sourcegit.worktree-base','devboard.worktree-base')],
            'src/ViewModels/InProgressContexts.cs': [('sourcegit.interactive_rebase','devboard.interactive_rebase')],
            'src/ViewModels/InteractiveRebase.cs': [('sourcegit.interactive_rebase','devboard.interactive_rebase')],
            'src/ViewModels/RepositoryConfigure.cs': [('sourcegit.account','devboard.account')],
            'src/ViewModels/RepositoryNode.cs': [('sourcegit.node','devboard.node')],
            'src/Views/About.axaml': [('Dev Board','DevBoard')],
            'src/Views/CommitMessageEditor.axaml.cs': [('sourcegit.settings','devboard.settings')],
            'src/Views/InteractiveRebase.axaml.cs': [('sourcegit-dnd-ir-item','devboard-dnd-ir-item')],
            'src/Views/LauncherTabBar.axaml.cs': [('sourcegit-dnd-main-tab','devboard-dnd-main-tab')],
            'src/Views/Welcome.axaml.cs': [('sourcegit-dnd-repo-node','devboard-dnd-repo-node')],
          }
          for path, pairs in replacements.items():
            p = Path(path)
            data = p.read_text(encoding='utf-8-sig')
            for old,new in pairs:
              data = data.replace(old,new)
            p.write_text(data, encoding='utf-8')

          for p in [Path('docs/branding/dev-board-logo.svg'), Path('docs/branding/dev-board-thumbnail.svg')]:
            if p.exists():
              data = p.read_text(encoding='utf-8').replace('Dev Board','DevBoard')
              p.write_text(data,encoding='utf-8')

          for p in Path('tests/DevBoard.Tests').rglob('*.cs'):
            data = p.read_text(encoding='utf-8-sig')
            data = data.replace('sourcegit-', 'devboard-').replace('sourcegit-default.gguf','devboard-default.gguf')
            p.write_text(data,encoding='utf-8')
          PY
      - name: Verify identity
        run: |
          node --test tests/devboard-identity.test.mjs
          node scripts/check-devboard-identity.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove stale DevBoard identity references'
          git push origin HEAD:refactor/devboard-identity
